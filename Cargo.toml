[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.3.68"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["B. Konti"]

# eframe 0.29.1 with the hidden-window busy-loop fix (egui PR #7905 backport), see
# third_party/eframe/src/native/run.rs ("Typed patch"). Offline, no other changes.
[patch.crates-io]
eframe = { path = "third_party/eframe" }
